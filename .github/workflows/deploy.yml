name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Prepare deployment files
        run: |
          mkdir -p deploy
          cp index.html manifest.json service-worker.js icon-*.png deploy/
          
          # Replace BUILD_TIMESTAMP with actual timestamp
          BUILD_TIME=$(date -u +"%Y-%m-%d %H:%M:%S UTC")
          sed -i "s/BUILD_TIMESTAMP/$BUILD_TIME/g" deploy/index.html
          
          echo "Build timestamp: $BUILD_TIME"
      
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./deploy
          force_orphan: true
